name: Bug report
description: Report incorrect behavior or a reproducible problem in Flowlyra.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Flowlyra. Please remove secrets and private source code before submitting.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior.
      placeholder: Flowlyra traced...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected the flow to...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps or a public example repository.
      placeholder: |
        1. Run ...
        2. Trace ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Flowlyra version / commit
      placeholder: v0.x.x or commit SHA

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22, etc.

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove tokens, credentials, private code, and sensitive data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private source code.
          required: true
